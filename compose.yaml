name: environmental-document-extraction

services:
  api:
    image: environmental-document-extraction-api:local
    build:
      context: .
      target: api
    environment:
      APP_ENVIRONMENT: production
      APP_CHANDRA_BASE_URL: http://ocr:9000
      APP_LOG_LEVEL: INFO
      APP_IMAGE_CLEANING_ENABLED: ${APP_IMAGE_CLEANING_ENABLED:-true}
    ports:
      - "8000:8000"
    depends_on:
      - ocr
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ocr:
    image: environmental-document-extraction-ocr-adapter:local
    user: "${OCR_CONTAINER_UID:-1000}:${OCR_CONTAINER_GID:-1000}"
    build:
      context: .
      target: ocr-adapter
    environment:
      OCR_PROVIDER: ${OCR_PROVIDER:-chandra}
      OCR_BACKEND_BASE_URL: ${OCR_BACKEND_BASE_URL:-http://llamactl:9099/v1}
      OCR_BACKEND_MODEL: ${OCR_BACKEND_MODEL:-chandra-ocr}
      OCR_BACKEND_API_KEY: ${OCR_BACKEND_API_KEY:-}
      OCR_MODEL_VERSION: ${OCR_MODEL_VERSION:-chandra-ocr-2.Q8_0+mmproj-f16}
      OCR_BACKEND_TIMEOUT_SECONDS: ${OCR_BACKEND_TIMEOUT_SECONDS:-90}
      OCR_MAX_OUTPUT_TOKENS: ${OCR_MAX_OUTPUT_TOKENS:-12384}
      OCR_MAX_CONCURRENT_REQUESTS: ${OCR_MAX_CONCURRENT_REQUESTS:-1}
      OCR_MAX_FILE_SIZE_BYTES: ${OCR_MAX_FILE_SIZE_BYTES:-15728640}
      OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-40000000}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_CONFIG_FILE: /tmp/aws/config
      AWS_SHARED_CREDENTIALS_FILE: /tmp/aws/credentials
    networks:
      - default
      - llm
    expose:
      - "9000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ${AWS_CONFIG_DIR:?Set AWS_CONFIG_DIR in .env.local to your host AWS config directory}:/tmp/aws:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  llm:
    external: true
    name: llm
